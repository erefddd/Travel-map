<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅運通・全運具整合平台 POC</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{--pg:#e9e4e1;--ink:#1b1215;--panel:#2a1c20;--panel2:#35242a;--line:#4a343b;--tx:#f6ecea;--mut:#b9a3a6;--org:#f08a24;--ok:#0fa863;--warn:#f5a524;--bad:#f01e1e;--vio:#7a4de8;--fs:1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0d0809}}
:root[data-theme="dark"]{--pg:#0d0809}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-hc="1"]{--ink:#000;--panel:#000;--panel2:#111;--line:#fff;--tx:#fff;--mut:#e6e6e6}
*{box-sizing:border-box;margin:0}
body{background:var(--pg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh;font-size:calc(14px*var(--fs))}
.app{width:100%;max-width:420px;height:100vh;background:radial-gradient(120% 40% at 50% 8%,#d98a5a55,transparent 70%),linear-gradient(180deg,#9a5440 0,#6b3530 26%,#3a1f22 60%,#221315 100%);display:flex;flex-direction:column}
html[data-hc="1"] .app{background:#000}
@media(min-width:460px){.app{margin:16px 0;height:min(860px,calc(100vh - 32px));border-radius:28px;overflow:hidden;box-shadow:0 20px 60px #0006}}
header{padding:14px 18px 8px;flex:none}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#1d3566,#0c1a3a);border:3px solid #d9b26a;display:grid;place-items:center;font-style:normal;font-weight:900;color:#f3d79a;flex:none}
.brand b{font-family:"Noto Serif TC",serif;font-size:2.1em;font-weight:900;letter-spacing:.06em;color:#fff;font-style:italic;text-shadow:0 2px 0 #7a2a1a,0 0 14px #ff9a5a99}
.brand span{font-size:.85em;background:linear-gradient(#f6d0bf,#d89a86);color:#4a2218;padding:4px 12px;border-radius:99px;font-weight:700;margin-left:auto;white-space:nowrap}
.upd{font-size:.8em;color:var(--mut);margin-top:4px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px #22b07d33;flex:none}
.mq{margin-top:8px;background:#fff;color:#3a1c1c;border-radius:10px;padding:7px 10px;font-size:.9em;white-space:nowrap;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px #0004}.mw{overflow:hidden;flex:1}
.mq span{display:inline-block;padding-left:100%;animation:mq 16s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.mq span{animation:none;padding:0}.mw{overflow:auto}}
main{flex:1;overflow-y:auto;padding:10px 18px 18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--org);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-weight:700;font-size:1.1em}.sub{font-size:.85em;color:var(--mut);margin-top:2px}
.pill{padding:5px 14px;min-width:64px;text-align:center;border-radius:8px;font-size:.95em;font-weight:700;color:#fff;white-space:nowrap;box-shadow:inset 0 1px 0 #fff5,0 2px 4px #0005}.near{background:linear-gradient(#f6d5c6,#e4aa95);color:#3a1c18;border-radius:16px;padding:0 14px 10px;margin-bottom:6px;box-shadow:0 6px 18px #0005}.nh{padding:10px 0;border-bottom:1px solid #b9806b88}.nh b{font-size:1.2em}.all{background:none;border:0;color:#3a1c18;font-weight:700}.nr{padding:9px 0;border-bottom:1px solid #b9806b55}.near .sub{color:#7a4a3e}.near .sw{background:#fff7;border-color:#b9806b;color:#3a1c18}
.ok{background:var(--ok)}.warn{background:var(--warn);color:#2a1a00}.bad{background:var(--bad)}.vio{background:var(--vio)}
.h3{font-weight:700;font-size:1.05em;margin:4px 0 8px}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.modes button{flex:1;min-width:54px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 2px;font-size:.85em;display:grid;gap:2px;place-items:center}
.modes button span,.grid button span{font-size:1.5em}
.modes button[aria-pressed="true"]{border-color:var(--org);background:var(--panel2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.grid button span,.modes button span,.foot button span{filter:grayscale(1) brightness(1.9)}
.grid button{background:linear-gradient(160deg,#3b2a2a,#150d0e);border:2px solid #b98a62;border-radius:18px;padding:16px 0;display:grid;place-items:center;gap:6px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 2px #0008,0 4px 10px #0006}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 6px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--tx);font-weight:700;border-color:var(--org)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-weight:700;padding:8px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--org);color:#2a1500}
.train{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center}
.no{font-weight:900;font-size:1.25em}.no small{display:block;font-weight:400;font-size:.65em;color:var(--mut)}
.tm{font-size:1.3em;font-weight:700;font-variant-numeric:tabular-nums}.tm i{font-style:normal;color:var(--mut);margin:0 5px;font-size:.8em}
.next{border-color:var(--org)}
.banner{background:#e5484d26;border:1px solid var(--bad);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.go{text-decoration:none;background:var(--org);color:#2a1500;font-weight:700;padding:8px 13px;border-radius:10px;white-space:nowrap}
.tag{font-size:.75em;padding:2px 8px;border-radius:99px;background:#f08a2433;color:var(--org);margin-left:6px;font-weight:700}
.ico{min-width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:900;font-size:.85em;padding:0 4px}
.left{display:flex;gap:11px;align-items:center}
.sw{background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.note{font-size:.8em;color:var(--mut);text-align:center;margin-top:6px}
.legend{display:flex;gap:10px;font-size:.8em;color:var(--mut);justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.map{width:100%;display:block;border-radius:12px;border:1px solid var(--line);margin-bottom:4px}
.chat{display:flex;flex-direction:column;gap:9px}
.me{align-self:flex-end;background:var(--org);color:#2a1500;padding:8px 12px;border-radius:14px 14px 3px 14px;max-width:80%}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);padding:9px 12px;border-radius:14px 14px 14px 3px;max-width:92%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:.9em}
.cmp{width:100%;border-collapse:collapse;margin-top:6px}.cmp td{padding:6px 2px;border-top:1px solid var(--line)}
.ask{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--line);background:var(--ink);flex:none}
.ask input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--tx);font:inherit}
.ask button{background:var(--org);border:0;border-radius:99px;width:42px;color:#2a1500;font-weight:900}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.set .seg{margin:0;min-width:150px}
.tg{width:46px;height:26px;border-radius:99px;border:0;background:#5b474c;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-checked="true"]{background:var(--ok)}.tg[aria-checked="true"]::after{left:23px}
.foot{display:flex;border-top:1px solid var(--line);background:var(--ink);flex:none}
.foot button{flex:1;background:none;border:0;padding:9px 0 11px;color:var(--mut);font-size:.8em;display:grid;gap:2px;place-items:center}
.foot button span{font-size:1.5em}.foot button[aria-current="page"]{color:var(--org);font-weight:700}.foot .c span{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d2a2,#b3753f);border:3px solid #3a2420;margin-top:-26px;display:grid;place-items:center;color:#2a1500;font-size:1.6em;box-shadow:0 0 0 2px #b98a62,0 4px 12px #0008;filter:none}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><i class="logo">運</i><b>旅運通</b><span id="slogan"></span></div>
  <div class="upd"><span class="dot"></span><span id="upd"></span></div>
  <div class="mq" id="mq" aria-live="polite"></div>
</header>
<main id="main"></main>
<form class="ask" id="ask" hidden onsubmit="return false"><input id="q" placeholder="輸入您的問題…" aria-label="輸入您的問題"><button id="send" aria-label="送出">➤</button></form>
<nav class="foot" id="foot"></nav>
</div>
<script>
var S={pg:'home',mode:'hsr',sub:0,dir:'S',abn:false,lang:'zh',fs:1,hc:false,tts:true,tip:false,msgs:[]};
var EN={'首頁':'Home','探索':'Explore','AI小幫手':'AI Assistant','設定':'Settings','高鐵':'HSR','台鐵':'TRA','客運':'Bus','公路':'Road','海運':'Sea','空運':'Air','鄰近場站':'Nearby stations','即時班表':'Live timetable','替代方案':'Alternatives','即時班次':'Live departures','異常資訊':'Disruptions','鄰近道路':'Nearby roads','即時路況':'Live traffic','重要路況':'Key incidents','替代道路':'Alt. roads','通阻資訊':'Closures','營運資訊':'Operations','機場營運資訊':'Airport ops','正常':'Normal','異常':'Abnormal','營運異常':'Disrupted','正常營運':'Operating','準點':'On time','南下':'Southbound','北上':'Northbound','導航':'Navigate','暢通':'Clear','車多':'Busy','壅塞':'Congested','停航':'Suspended','一般設定':'General','無障礙設定':'Accessibility','語言選擇':'Language','字體大小':'Font size','顯示模式':'Display','語音功能':'Voice','語音朗讀':'Read aloud','語音提示':'Voice alerts','標準':'Standard','大':'Large','特大':'X-Large','標準模式':'Standard','高對比模式':'High contrast','鄰近場站 ':'Nearby','多運具旅運服務':'Multimodal travel','更新時間':'Updated','目前位置':'You are here','建議':'Suggested','最快':'Fastest','AI助理':'AI Assistant','聯絡我們':'Contact us','查看全部':'See all'};
function t(s){return S.lang==='en'&&EN[s]||s}
function pad(n){return (n<10?'0':'')+n}
function tp(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}))}
function nowMin(){var d=tp();return d.getHours()*60+d.getMinutes()}
function fmt(m){m=m%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
var MODES=[['hsr','🚄','高鐵'],['tra','🚆','台鐵'],['bus','🚌','客運'],['road','🛣️','公路'],['sea','🚢','海運'],['air','✈️','空運']];
var SUB={hsr:['鄰近場站','即時班表','替代方案'],tra:['鄰近場站','即時班表','替代方案'],bus:['鄰近場站','即時班次','異常資訊','替代方案'],road:['鄰近道路','即時路況','重要路況','替代道路'],sea:['通阻資訊','營運資訊','替代方案'],air:['通阻資訊','機場營運資訊','替代方案']};
function pill(x,c){return '<span class="pill '+c+'">'+t(x)+'</span>'}
function card(a,b,x,c){return '<div class="card row"><div><div class="nm">'+t(a)+'</div><div class="sub">'+b+'</div></div>'+pill(x,c)+'</div>'}
function alts(L){return L.map(function(a){return '<div class="card row"><div class="left"><div class="ico">'+a[0]+'</div><div><div class="nm">'+a[1]+(a[4]?'<span class="tag">'+t('建議')+'</span>':'')+'</div><div class="sub">'+a[2]+'</div></div></div><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a[3])+'">'+t('導航')+'</a></div>'}).join('')+'<p class="note">導航將開啟地圖 App，POC 未串接正式路線資料</p>'}
function demo(){return '<div class="row sub" style="margin-top:6px"><span>展示用：模擬台中站異常</span><button class="sw" data-a="abn">'+(S.abn?'恢復正常':'切換為異常')+'</button></div>'}
function status(x){if(S.abn&&x.no%3===0)return['異常停駛','bad'];if(S.abn)return['延誤 '+(x.late||8)+' 分','warn'];return x.late?['誤點 '+x.late+' 分','warn']:['準點','ok']}
function hsr(dir){
  var DEST={S:[['左營',47],['台南',32],['嘉義',16]],N:[['南港',58],['台北',54],['桃園',39]]}[dir],out=[],k=0,nm=nowMin();
  for(var tt=dir==='S'?372:380;tt<1410;tt+=dir==='S'?17:19,k++){var d=DEST[k%3];out.push({no:(dir==='S'?801:802)+k*2,dep:tt,dur:d[1],to:d[0],late:k%7===3?(k%2?5:12):0})}
  var L=out.filter(function(x){return x.dep>=nm}).slice(0,6);return L.length?L:out.slice(0,6)}
var ALT_HSR=function(){return[['台鐵','台鐵新烏日站','步行約 3 分到站，區間車往彰化／台中，約 15 分一班','新烏日站',S.abn],['客運','國道客運','高鐵台中站往台北／高雄，約每 30 分一班','高鐵台中站 客運'],['公路','國道一號自駕','台中系統交流道上國道，注意即時路況','台中系統交流道']]};
function explore(){
  var m=S.mode,i=S.sub,h='<div class="modes">'+MODES.map(function(x){return '<button data-m="'+x[0]+'" aria-pressed="'+(S.mode===x[0])+'"><span>'+x[1]+'</span>'+t(x[2])+'</button>'}).join('')+'</div>';
  h+='<div class="tabs" role="tablist">'+SUB[m].map(function(s,j){return '<button role="tab" data-s="'+j+'" aria-selected="'+(i===j)+'">'+t(s)+'</button>'}).join('')+'</div>';
  if(S.abn&&m==='hsr')h+='<div class="banner">高鐵台中站營運異常，請參考即時班表與替代方案。</div>';
  var st=S.abn?['營運異常','bad']:['正常','ok'];
  if(m==='hsr'){
    if(i===0)h+=card('高鐵台中站','0.4 公里・目前位置',st[0],st[1])+card('高鐵彰化站','約 19 公里・南下方向','正常','ok')+card('高鐵苗栗站','約 32 公里・北上方向','正常','ok')+demo();
    if(i===1){h+='<div class="seg"><button data-d="S" aria-pressed="'+(S.dir==='S')+'">'+t('南下')+'</button><button data-d="N" aria-pressed="'+(S.dir==='N')+'">'+t('北上')+'</button></div><div class="sub" style="margin-bottom:8px">起站 台中 → 訖站 '+(S.dir==='S'?'左營／台南／嘉義':'南港／台北／桃園')+'</div>';
      hsr(S.dir).forEach(function(x,j){var s=status(x);h+='<div class="card train'+(j?'':' next')+'"><div class="no">'+x.no+'<small>'+x.to+'</small></div><div><span class="tm">'+fmt(x.dep)+'<i>→</i>'+fmt(x.dep+x.dur)+'</span><div class="sub">台中 → '+x.to+'・約 '+x.dur+' 分</div></div>'+pill(s[0],s[1])+'</div>'})}
    if(i===2)h+=alts(ALT_HSR());
  }
  if(m==='tra'){
    if(i===0)h+=card('台鐵新烏日站','0.6 公里・與高鐵台中站轉乘','正常','ok')+card('台鐵台中站','約 11 公里','正常','ok')+card('台鐵彰化站','約 20 公里','準點','ok');
    if(i===1){h+='<div class="seg"><button data-d="S" aria-pressed="'+(S.dir==='S')+'">'+t('南下')+'</button><button data-d="N" aria-pressed="'+(S.dir==='N')+'">'+t('北上')+'</button></div>';var n=nowMin()+4;
      [['自強',171,'樹林','潮州',0,1],['區間',2237,'新烏日','彰化',3,2],['區間快',3129,'新烏日','員林',0,1],['自強',123,'汐止','屏東',9,2]].forEach(function(r,j){var late=r[4],e=S.dir==='S'?r[3]:r[2];
        h+='<div class="card train"><div class="no">'+r[1]+'<small>'+r[0]+'</small></div><div><span class="tm">'+fmt(n+j*13)+'</span><div class="sub">新烏日 → '+e+'・'+(S.dir==='S'?'南下':'北上')+' '+r[5]+' 號月台</div></div>'+pill(late?'誤點 '+late+' 分':'準點',late?'warn':'ok')+'</div>'})}
    if(i===2)h+=alts([['高鐵','高鐵台中站','由新烏日站步行轉乘，約 10 分鐘','高鐵台中站'],['客運','國道客運','新烏日周邊客運站，約每 30 分一班','新烏日站 客運'],['公路','國道一號自駕','經台中系統交流道','台中系統交流道']]);
  }
  if(m==='bus'){
    if(i===0)h+=card('烏日高鐵站客運站','0.5 公里・營運中','正常','ok')+card('台中火車站轉運站','約 11 公里・營運中','正常','ok');
    if(i===1)h+=[['1820','台中—台北','業者 A',nowMin()+8,'正常','ok'],['1833','台中—台北（高鐵站）','業者 B',nowMin()+21,'正常','ok'],['6899','台中—高雄','業者 A',nowMin()+34,'延誤 10 分','warn']].map(function(r){return '<div class="card train"><div class="no">'+r[0]+'<small>'+r[2]+'</small></div><div><span class="tm">'+fmt(r[3])+'</span><div class="sub">'+r[1]+'</div></div>'+pill(r[4],r[5])+'</div>'}).join('');
    if(i===2)h+=card('1833 路線異動','國道施工，停靠站暫時調整','異動','warn')+card('6899 末班車','21:30 已駛離高鐵站','末班','vio')+card('1820 班次','今日 17:40 班次取消','異常','bad');
    if(i===3)h+=alts([['高鐵','高鐵台中站','南下／北上班次依即時班表','高鐵台中站'],['台鐵','台鐵新烏日站','區間車約 15 分一班','新烏日站'],['公路','國道一號自駕','注意即時路況','台中系統交流道']]);
  }

  return h}
function route(){
  var r=[['高鐵',S.abn?'暫停':'約 58 分',S.abn?'bad':'ok'],['台鐵','約 110 分','ok'],['客運','約 150 分','warn'],['自駕','約 120 分（國道1號車多）','warn']];
  var best=S.abn?'台鐵':'高鐵';
  return '<b>台中 → 台北</b>，依目前路況與營運狀態比較：<table class="cmp">'+r.map(function(x){return '<tr><td>'+t(x[0])+(x[0]===best?'<span class="tag">'+t('最快')+'</span>':'')+'</td><td>'+x[1]+'</td></tr>'}).join('')+'</table>'}
function reply(q){
  if(/高鐵|異常|替代/.test(q))return S.abn?'高鐵台中站目前營運異常，建議改搭台鐵新烏日站區間車，步行約 3 分鐘即可到站。':'高鐵台中站目前正常營運。如遇異常，可改搭台鐵新烏日站、國道客運或自駕。';
  if(/國道|塞|路況|事故/.test(q))return '國道1號北上 K168 發生事故，目前車多。替代路線：國道1號 → 台74線 → 台1線。';
  if(/台北|去|怎麼|路線|規劃/.test(q))return route();
  return '我可以協助查詢路況、比較運具與規劃路線，也可以試著問「台中到台北怎麼去？」'}
function ai(){
  if(!S.msgs.length)S.msgs.push(['bot','您好，我是旅運小幫手。可詢問路線、路況或替代運具。']);
  return '<div class="chat" aria-live="polite">'+S.msgs.map(function(m){return '<div class="'+(m[0]==='me'?'me':'bot')+'">'+m[1]+'</div>'}).join('')+'</div><div class="chips">'+['台中到台北怎麼去？','國道一號塞車嗎？','高鐵異常有哪些替代？'].map(function(c){return '<button data-q="'+c+'">'+c+'</button>'}).join('')+'</div>'}
function contact(){return '<div class="h3">'+t('聯絡我們')+'</div><div class="card"><div class="nm">客服專線</div><div class="sub">週一至週五 08:30–17:30（模擬）</div></div><div class="card"><div class="nm">意見回饋</div><div class="sub">提供使用問題或功能建議（模擬）</div></div>'}
function seg(k,opts){return '<div class="seg">'+opts.map(function(o){return '<button data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+(String(S[k])===String(o[0]))+'">'+o[1]+'</button>'}).join('')+'</div>'}
function tg(k){return '<button class="tg" role="switch" data-tg="'+k+'" aria-checked="'+S[k]+'"></button>'}
function settings(){
  return '<div class="h3">'+t('一般設定')+'</div><div class="card"><div class="set"><span class="nm">'+t('語言選擇')+'</span>'+seg('lang',[['zh','繁體中文'],['en','English']])+'</div></div><div class="h3">'+t('無障礙設定')+'</div><div class="card"><div class="set"><span class="nm">'+t('字體大小')+'</span>'+seg('fs',[[1,t('標準')],[1.15,t('大')],[1.3,t('特大')]])+'</div><div class="set"><span class="nm">'+t('顯示模式')+'</span>'+seg('hc',[[false,t('標準模式')],[true,t('高對比模式')]])+'</div><div class="set"><span class="nm">'+t('語音朗讀')+'</span>'+tg('tts')+'</div><div class="set" style="margin:0"><span class="nm">'+t('語音提示')+'</span>'+tg('tip')+'</div></div>'}
function render(){
  var d=tp(),w='日一二三四五六'[d.getDay()];
  document.documentElement.lang=S.lang==='en'?'en':'zh-Hant';
  document.documentElement.dataset.hc=S.hc?'1':'0';document.documentElement.style.setProperty('--fs',S.fs);
  document.getElementById('slogan').textContent=t('多運具旅運服務');
  document.getElementById('upd').textContent=t('更新時間')+' '+d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+'（'+w+'）'+pad(d.getHours())+':'+pad(d.getMinutes())+'・GPS：臺中市烏日區（模擬）';
  document.getElementById('mq').innerHTML='<b>📣</b><div class="mw"><span>'+(S.abn?'【異常】高鐵台中站營運異常，請參考替代方案。':'【快訊】國道1號北上 K168 事故，車多；高鐵台中站正常營運。')+'</span></div>';
  var m=document.getElementById('main');m.innerHTML=S.pg==='home'?home():S.pg==='explore'?explore():S.pg==='ai'?ai():S.pg==='contact'?contact():settings();
  document.getElementById('ask').hidden=S.pg!=='ai';
  var N=[['home','🏠','首頁'],['explore','🧭','探索'],['ai','✦','AI助理'],['set','⚙️','設定'],['contact','☺','聯絡我們']];
  document.getElementById('foot').innerHTML=N.map(function(x){return '<button data-p="'+x[0]+'"'+(x[0]==='ai'?' class="c"':'')+(S.pg===x[0]?' aria-current="page"':'')+'><span>'+x[1]+'</span>'+t(x[2])+'</button>'}).join('');
}
function say(q){S.msgs.push(['me',q]);S.msgs.push(['bot',reply(q)]);render();var c=document.getElementById('main');c.scrollTop=c.scrollHeight;
  if(S.tts){try{var u=new SpeechSynthesisUtterance(c.querySelector('.chat').lastChild.textContent);u.lang=S.lang==='en'?'en-US':'zh-TW';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
document.addEventListener('click',function(e){
  var g=function(a){var n=e.target.closest('['+a+']');return n&&n.getAttribute(a)};var v;
  if(v=g('data-p')){S.pg=v}
  else if(v=g('data-go')){S.pg='explore';S.mode=v;S.sub=0}
  else if(v=g('data-m')){S.mode=v;S.sub=0}
  else if(v=g('data-s')){S.sub=+v}
  else if(v=g('data-d')){S.dir=v}
  else if(g('data-a')==='abn'){S.abn=!S.abn}
  else if(v=g('data-q')){return say(v)}
  else if(g('data-k')){var b=e.target.closest('[data-k]'),k=b.dataset.k,x=b.dataset.v;S[k]=(k==='fs')?+x:(k==='hc')?x==='true':x}
  else if(v=g('data-tg')){S[v]=!S[v]}
  else if(e.target.closest('#send')){var i=document.getElementById('q');if(i.value.trim()){var q=i.value.trim();i.value='';return say(q)}return}
  else return;
  render()});
document.getElementById('ask').addEventListener('submit',function(){document.getElementById('send').click()});
setInterval(render,60000);render();
</script>
</body>
</html>
